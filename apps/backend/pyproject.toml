[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "super-ai-backend"
version = "0.1.0"
description = "智能 OnCall Agent 的最小 FastAPI 工程基础"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain>=1,<2",
  "langchain-mcp-adapters>=0.1,<1",
  "langchain-openai>=1,<2",
  "langchain-text-splitters>=1,<2",
  "langgraph>=1,<2",
  "mcp>=1,<2",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.10,<3",
  "pymilvus>=3,<4",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "rank-bm25>=0.2.2,<1",
  "sqlalchemy[asyncio]>=2,<3",
]

[dependency-groups]
dev = [
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/super_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../../tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["src", "tests", "../../tests"]
stubPath = "typings"
venvPath = "."
venv = ".venv"
